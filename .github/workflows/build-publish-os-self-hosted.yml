name: Smoke Build — OS (Self-hosted, non-publishing)
# Manual build-only workflow for on-demand verification that an OS build succeeds
# on the real hardware builder. Does NOT publish to GHCR.
# Official publication is done by official-nightly.yml and official-release.yml.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target (for example rpi)"
        required: true
        default: "rpi"
        type: string
      variant:
        description: "Variant label (for example prod/dev)"
        required: true
        default: "prod"
        type: string
      version:
        description: "Version label embedded in metadata"
        required: true
        default: "dev"
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: smoke-build-os-${{ inputs.target }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke-build:
    runs-on: [self-hosted, ourbox-builder, matchbox-build]
    timeout-minutes: 240
    env:
      OURBOX_TARGET: ${{ inputs.target }}
      OURBOX_VARIANT: ${{ inputs.variant }}
      OURBOX_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Bootstrap host dependencies
        run: sudo ./tools/bootstrap-host.sh

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve current beta upstream inputs
        run: |
          set -euo pipefail
          source ./tools/approved-upstream-inputs.upstream.env
          python3 ./tools/release-control/release_control.py resolve-approved-upstream-input \
            --github-repo "${SW_OURBOX_OS_APPROVED_INPUTS_REPO}" \
            --github-ref "${SW_OURBOX_OS_APPROVED_INPUTS_REVISION}" \
            --github-path "${SW_OURBOX_OS_APPROVED_INPUTS_PATH}" \
            --artifact-key matchbox_ourbox_substrate \
            --channel-key candidate \
            --env-var OURBOX_SUBSTRATE_REF \
            --github-env "${GITHUB_ENV}"
          python3 ./tools/release-control/release_control.py resolve-approved-upstream-input \
            --github-repo "${SW_OURBOX_OS_APPROVED_INPUTS_REPO}" \
            --github-ref "${SW_OURBOX_OS_APPROVED_INPUTS_REVISION}" \
            --github-path "${SW_OURBOX_OS_APPROVED_INPUTS_PATH}" \
            --artifact-key platform_contract \
            --channel-key candidate \
            --env-var OURBOX_PLATFORM_CONTRACT_REF \
            --github-env "${GITHUB_ENV}"

      - name: Fetch pinned upstream inputs
        run: ./tools/fetch-ourbox-substrate.sh
        env:
          OURBOX_REQUIRE_PINNED_OFFICIAL_INPUTS: "1"

      - name: Build OS image
        run: sudo -E ./tools/build-image.sh

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-os-build-${{ github.run_id }}
          path: |
            deploy/*.info
            deploy/build.log
          if-no-files-found: warn
