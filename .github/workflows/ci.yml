name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanitization:
    name: Public repo sanitization check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden internal infrastructure details
        run: bash tools/check-public-sanitization.sh

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run shellcheck on build/publish scripts
        run: |
          shellcheck tools/*.sh
          shellcheck tools/media-adapter/*.sh
          shellcheck tools/release-control/*.sh

      - name: Validate media adapter metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          adapter = json.loads(Path("tools/media-adapter/adapter.json").read_text(encoding="utf-8"))
          if adapter.get("target_id") != "matchbox":
              raise SystemExit("tools/media-adapter/adapter.json must declare target_id=matchbox")
          if adapter.get("substrate_selection_model") != "published-substrate-bundle":
              raise SystemExit("tools/media-adapter/adapter.json must declare substrate_selection_model=published-substrate-bundle")
          PY

      - name: Check shell syntax (bash -n)
        run: |
          for f in tools/*.sh; do
            bash -n "${f}" && echo "OK: ${f}"
          done
          for f in tools/media-adapter/*.sh; do
            bash -n "${f}" && echo "OK: ${f}"
          done
          for f in tools/release-control/*.sh; do
            bash -n "${f}" && echo "OK: ${f}"
          done

  installer-ssh-vendoring:
    name: Vendored installer SSH helper sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored installer SSH helper
        run: bash tools/check-vendored-installer-ssh-helper.sh

  installer-ssh-policy:
    name: Installer SSH policy smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer SSH policy smoke
        run: bash tools/check-installer-ssh-policy-smoke.sh

  installer-substrate-smoke-helper:
    name: Installer substrate smoke helper regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer substrate smoke helper regression
        run: bash tools/check-installer-substrate-smoke-helper-smoke.sh

  local-mission-runtime:
    name: Matchbox local mission runtime smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Matchbox local mission runtime smoke
        run: bash tools/check-local-mission-runtime-smoke.sh

  platform-contract-shape:
    name: Platform contract shape smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run platform contract shape smoke
        run: bash tools/check-validate-platform-contract-shape-smoke.sh

  upstream-input-env:
    name: Upstream input env contract smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify fetch scripts require explicit upstream refs
        run: bash tools/check-upstream-input-env-smoke.sh

  release-control-vendoring:
    name: Vendored release-control sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored release-control module
        run: bash tools/check-vendored-release-control.sh

  release-control-smoke:
    name: Release-control smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release-control smoke test
        run: bash tools/check-release-control-smoke.sh

  os-publish-smoke:
    name: OS publish smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OS publish smoke test
        run: bash tools/check-publish-os-artifact-smoke.sh

  workflow-safety:
    name: Workflow trust boundary check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check workflow trust boundaries
        run: bash tools/check-workflow-safety.sh

      - name: Check for mirrored upstream pins in control-plane surfaces
        run: bash tools/check-no-mirrored-upstream-pins.sh

  pr-batch-big-picture:
    name: PR batch comparison tool tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PR batch comparison tool tests
        run: python3 tools/test_pr_batch_big_picture.py
